name: Bookmark preview (no merge)
on:
  push:
    branches: ['arena/645f2a96-hanja-test']
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}preview/
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: node --test tests/unit/*.test.cjs
      - run: bash scripts/build-preview.sh
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config playwright.preview.config.cjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: preview-test-report
          path: |
            playwright-report/
            test-results/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy preview alongside main
        id: deployment
        uses: actions/deploy-pages@v4
