name: Verify and deploy static Pages
on:
  push:
    branches: [main, 'arena/**']
    paths-ignore: ['docs/**', '**.md']
  pull_request:
    branches: [main]
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
# A repository has ONE Pages deployment. Serialize main/preview deployments.
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/verify.yml
    with:
      preview: ${{ github.event_name != 'pull_request' && github.repository == 'zzexxous-pixel/hanja-test' }}
      # Main rebuilds the selected preview too, so main deployment does not erase it.
      # Set repository variable PREVIEW_REF when another session becomes the active preview.
      preview_ref: ${{ github.ref_name == 'main' && (vars.PREVIEW_REF || 'origin/arena/645f2a96-hanja-test') || '' }}
  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      # Only HTTP checks; no npm install, CSS rebuild or browser installation.
      - run: npm run test:smoke
        env:
          SMOKE_URL: https://zzexxous-pixel.github.io/${{ github.event.repository.name }}/${{ startsWith(github.ref_name, 'arena/') && 'preview/' || '' }}
          EXPECTED_SHA: ${{ github.sha }}
