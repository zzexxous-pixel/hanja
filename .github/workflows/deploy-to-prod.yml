name: 운영 서버(hanja) 수동 이관
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: github.ref == 'refs/heads/main' && github.repository == 'zzexxous-pixel/hanja-test'
    uses: ./.github/workflows/verify.yml
  transfer:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      # Existing source-repository transfer convention. No second npm install/build here.
      # The hanja repository's main Pages workflow verifies/packages the production copy.
      - name: Transfer approved main to production
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          git remote add production "https://x-access-token:${SYNC_TOKEN}@github.com/zzexxous-pixel/hanja.git"
          git push production HEAD:main --force
