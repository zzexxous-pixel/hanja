name: Static verification
on:
  workflow_call:
    inputs:
      preview:
        type: boolean
        default: false
      preview_ref:
        type: string
        default: ''
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: '1'
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check && npm run test:unit
      - name: Package static files once
        env:
          PREVIEW_REF: ${{ inputs.preview_ref }}
        run: |
          if [ '${{ inputs.preview }}' = 'true' ]; then npm run build:preview; else npm run build; fi
      - run: npx playwright install --with-deps chromium
      - name: Verify main root as well when preserving a preview
        if: inputs.preview && github.ref == 'refs/heads/main'
        run: npm run test:e2e
        env:
          APP_PATH: /
      - run: npm run test:e2e
        env:
          APP_PATH: ${{ inputs.preview && '/preview/' || '/' }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-report
          path: |
            playwright-report/
            test-results/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
